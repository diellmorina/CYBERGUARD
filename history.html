<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/cyberguard-icon-192.png">
  <title>Learning History - CyberGuard</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="js/cloud-sync.js"></script>
  <script src="js/auth-guard.js"></script>
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header"><div class="sidebar-logo"><i class="fas fa-shield-alt"></i></div><div><h1 class="sidebar-title">CyberGuard</h1><p class="sidebar-tagline">Stay Secure</p></div></div>
    <div class="user-card"><div class="user-avatar" id="sidebar-avatar"><i class="fas fa-user"></i></div><div class="user-name" id="sidebar-username">Cyber Learner</div><div class="user-level" id="sidebar-level">Level 1</div><div class="user-xp" id="sidebar-xp">0 XP</div></div>
    <nav><ul class="nav-list">
      <li><a href="dashboard.html" class="nav-item"><span class="nav-icon"><i class="fas fa-chart-bar"></i></span><span>Dashboard</span></a></li>
      <li><a href="password-lab.html" class="nav-item"><span class="nav-icon"><i class="fas fa-lock"></i></span><span>Password Lab</span></a></li>
      <li><a href="link-analyzer.html" class="nav-item"><span class="nav-icon"><i class="fas fa-link"></i></span><span>Link Analyzer</span></a></li>
      <li><a href="phishing-center.html" class="nav-item"><span class="nav-icon"><i class="fas fa-envelope"></i></span><span>Phishing Center</span></a></li>
      <li><a href="academy.html" class="nav-item"><span class="nav-icon"><i class="fas fa-book"></i></span><span>Academy</span></a></li>
      <li><a href="quiz.html" class="nav-item"><span class="nav-icon"><i class="fas fa-question-circle"></i></span><span>Quizzes</span></a></li>
      <li><a href="achievements.html" class="nav-item"><span class="nav-icon"><i class="fas fa-trophy"></i></span><span>Achievements</span></a></li>
      <li><a href="history.html" class="nav-item active"><span class="nav-icon"><i class="fas fa-history"></i></span><span>History</span></a></li>
      <li><a href="profile.html" class="nav-item"><span class="nav-icon"><i class="fas fa-user-circle"></i></span><span>Profile</span></a></li>
      <li><a href="settings.html" class="nav-item"><span class="nav-icon"><i class="fas fa-cog"></i></span><span>Settings</span></a></li>
    </ul></nav>
  </aside>

  <main class="main-content">
    <header class="header">
      <h1 class="header-title">Learning History</h1>
      <div class="header-actions">
        <button id="theme-toggle" class="theme-toggle"><i class="fas fa-moon"></i></button>
        <button id="mobile-menu-btn" class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
      </div>
    </header>

    <div class="page-content">
      <div class="card">
        <div class="card-header">
          <h3 class="card-title">Your Activities</h3>
          <button id="clear-history" class="btn btn-small btn-danger">Clear History</button>
        </div>
        <div id="history-list" style="display: flex; flex-direction: column; gap: 0.75rem;">
          <!-- History items will be populated here -->
        </div>
      </div>
    </div>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const profile = Storage.getProfile();
      const activities = Storage.getActivities();
      const list = document.getElementById('history-list');

      if (activities.length === 0) {
        list.innerHTML = '<div class="empty-state"><div class="empty-icon">📝</div><div class="empty-title">No activities yet</div><div class="empty-description">Start learning to see your history here</div></div>';
      } else {
        list.innerHTML = activities.reverse().map(act => {
          const date = new Date(act.timestamp);
          const dateStr = date.toLocaleDateString() + ' ' + date.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
          const icon = act.type === 'lesson-completed' ? '📚' : '❓';
          const title = act.type === 'lesson-completed' ? `Completed: ${act.details.lessonTitle}` : `Quiz: ${act.details.category} (${act.details.percentage}%)`;
          return `
            <div style="padding: 1rem; background: var(--bg-secondary); border-radius: var(--radius-md); border-left: 4px solid var(--accent-primary);">
              <div style="display: flex; justify-content: space-between; align-items: start;">
                <div><span style="font-size: 1.2rem;">${icon}</span> <strong>${title}</strong><br><small style="color: var(--text-secondary);">${dateStr}</small></div>
              </div>
            </div>
          `;
        }).join('');
      }

      document.getElementById('clear-history').addEventListener('click', () => {
        if (confirm('Clear all learning history? This cannot be undone.')) {
          Storage.clearActivities();
          location.reload();
        }
      });

      const avatars = ['👤', '🔐', '🛡️', '👨‍💻', '👩‍💻'];
      const idx = parseInt(profile.avatar.split('-')[1]) % avatars.length;
      document.getElementById('sidebar-avatar').textContent = avatars[idx];
      document.getElementById('sidebar-username').textContent = profile.displayName;
      document.getElementById('sidebar-level').textContent = `Level ${profile.level}`;
      document.getElementById('sidebar-xp').textContent = `${profile.totalXP} XP`;
    });
  </script>
</body>
</html>
