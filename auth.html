<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - CyberGuard</title>
  <meta name="description" content="Sign in or create a CyberGuard account with Google or email.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/landing.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="landing-page auth-page">
  <nav class="landing-navbar">
    <div class="container navbar-content">
      <a href="index.html" class="navbar-brand">
        <span class="navbar-logo"><i class="fas fa-shield-alt"></i></span>
        <span class="navbar-title">CyberGuard</span>
      </a>
      <ul class="navbar-menu">
        <li><a href="index.html" class="nav-link">Home</a></li>
        <li><button id="landing-theme-toggle" class="theme-toggle" aria-label="Toggle theme"><i class="fas fa-moon"></i></button></li>
      </ul>
      <button id="mobile-nav-toggle" class="mobile-nav-toggle" aria-label="Toggle navigation"><i class="fas fa-bars"></i></button>
    </div>
  </nav>

  <main class="auth-main">
    <section class="auth-card" aria-labelledby="auth-title">
      <div class="auth-icon"><i class="fas fa-shield-alt"></i></div>
      <h1 id="auth-title">Welcome back</h1>
      <p class="auth-intro">Sign in to your CyberGuard account to continue.</p>

      <div id="auth-panel">
        <button id="google-sign-in" class="btn btn-secondary auth-google" type="button">
          <i class="fab fa-google" aria-hidden="true"></i>
          Continue with Google
        </button>

        <div class="auth-divider"><span>or continue with email</span></div>

        <form id="email-auth-form" class="auth-form">
          <div class="auth-field">
            <label for="auth-email">Email address</label>
            <input id="auth-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
          </div>
          <div class="auth-field">
            <label for="auth-password">Password</label>
            <input id="auth-password" name="password" type="password" autocomplete="current-password" minlength="6" required>
          </div>
          <div id="password-confirm-field" class="auth-field" hidden>
            <label for="auth-password-confirm">Confirm password</label>
            <input id="auth-password-confirm" name="passwordConfirm" type="password" autocomplete="new-password" minlength="6">
          </div>
          <button id="email-submit" class="btn btn-primary auth-submit" type="submit">Sign In</button>
        </form>

        <p class="auth-switch">
          <span id="auth-switch-prompt">Don’t have an account?</span>
          <button id="auth-switch" class="auth-text-button" type="button">Create one</button>
        </p>
      </div>

      <div id="signed-in-panel" class="signed-in-panel" hidden>
        <p>You’re signed in as</p>
        <strong id="signed-in-email"></strong>
        <a class="btn btn-primary auth-submit" href="dashboard.html">Continue to CyberGuard</a>
        <button id="sign-out" class="auth-text-button" type="button">Sign out</button>
      </div>

      <p id="auth-status" class="auth-status" role="status" aria-live="polite"></p>
      <p class="auth-privacy">Your learning progress remains stored locally in this browser. Signing in does not sync it across devices.</p>
    </section>
  </main>

  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
  <script src="js/landing.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
